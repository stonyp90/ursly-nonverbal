<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ursly — Analyse non verbale</title>
<meta name="description" content="Ursly Non-verbal : un indice de tension mesuré pendant qu'une personne parle — jamais un verdict de mensonge. Une seule page, plein écran : la vidéo, puis l'aperçu temps réel.">
<style>
  :root { --bg:#0a1220; --ink:#e8f1f8; --cyan:#4cc9f0; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); overflow:hidden; }

  /* ---------- UNE SEULE PAGE, PLEIN ÉCRAN : la vidéo, et un seul geste ---------- */
  .stage { position:fixed; inset:0; overflow:hidden; }
  .stage video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .veil { position:absolute; inset:0; background:linear-gradient(180deg, rgba(10,18,32,.30) 0%, rgba(10,18,32,0) 30%, rgba(10,18,32,0) 62%, rgba(10,18,32,.55) 100%); pointer-events:none; }
  /* Le logo, plus gros, SANS fond — en haut au centre : c'est la seule zone haute libre
     dans toutes les scènes (le panneau d'analyse de la vidéo occupe le haut-gauche
     dans deux scènes sur cinq ; le logo ne doit jamais recouvrir les statistiques). */
  .brandmark { position:absolute; top:clamp(18px, 4.5vmin, 44px); left:50%; transform:translateX(-50%); }
  .brandmark img { display:block; height:52px; width:auto; filter:drop-shadow(0 2px 10px rgba(4,12,22,.55)); }
  @media (max-width: 760px) { .brandmark img { height:38px; } }

  /* Aucun texte par-dessus la vidéo : son UI d'analyse est DANS la vidéo.
     Le seul élément de la page = l'appel à l'aperçu temps réel, en bas à droite. */
  .cta { position:absolute; right:clamp(24px, 6vmin, 64px); bottom:clamp(24px, 5.5vmin, 56px); }
  .btn { display:inline-block; padding:13px 20px; border-radius:12px; border:1px solid var(--cyan); color:#04222f; text-decoration:none; font-weight:700; font-size:15px; background:var(--cyan); box-shadow:0 4px 24px rgba(4,20,32,.45); }
  .btn:hover { filter:brightness(1.07); }
</style>
</head>
<body>

<main class="stage">
  <video id="heroVideo" autoplay muted loop playsinline poster="assets/poster-v3.jpg">
    <source src="assets/hero-nonverbal-v3.mp4" type="video/mp4">
  </video>
  <div class="veil"></div>
  <div class="brandmark"><img src="assets/ursly-wordmark.svg" alt="Ursly"></div>

  <div class="cta">
    <a class="btn" href="live.html">Essayer l'aperçu temps réel</a>
  </div>
</main>

</body>
</html>
